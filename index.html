<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Text Replacer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --panel-bg: #111214;
            --accent: #00f0ff;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1e1f22;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- CONTROLS SIDEBAR --- */
        .sidebar {
            width: 340px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn {
            background: #313338;
            color: #fff;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }

        .btn:hover {
            border-color: var(--accent);
            background: rgba(0, 240, 255, 0.1);
        }

        .btn-main {
            background: var(--accent);
            color: #000;
        }

        .btn-main:hover {
            background: #00c8d6;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .instructions {
            font-size: 0.85rem;
            color: #949ba4;
            line-height: 1.4;
            background: rgba(255,255,255,0.02);
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid var(--accent);
        }

        /* --- WORKSPACE --- */
        .workspace {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
            position: relative;
        }

        /* Container that holds the uploaded image and the editable text boxes */
        #editor-container {
            position: relative;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #base-image {
            display: block;
            max-height: 85vh;
            width: auto;
        }

        /* The dynamic text box layers that look like inputs on the image */
        .text-patch {
            position: absolute;
            background: #000000; /* Default matches your midnight theme screenshot */
            color: #e0e1e5;
            border: 1px dashed rgba(0, 240, 255, 0.5);
            font-size: 14px; /* Default sizing closer to mobile layout */
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            outline: none;
            padding: 2px 4px;
            white-space: pre-wrap;
            cursor: move;
            min-width: 50px;
            min-height: 20px;
        }

        /* Remove dashed border when exporting */
        .text-patch.exporting {
            border: none !important;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Text Replacer</h2>
        <p class="instructions">
            1. Upload your chat screenshot.<br>
            2. Click "Add Text Block".<br>
            3. Drag the block over the original text.<br>
            4. Type your new message directly into it.<br>
            5. Double-click a block to remove it.
        </p>

        <input type="file" id="upload-img" accept="image/*" style="display: none;">
        <label for="upload-img" class="btn">Upload Screenshot</label>

        <button class="btn" onclick="addTextBlock()">+ Add Text Block</button>

        <div style="display: flex; flex-direction: column; gap: 5px; margin-top: 10px;">
            <label style="font-size: 0.8rem; color: #aaa;">Patch Background Color:</label>
            <input type="color" id="patch-color" value="#000000" style="width:100%; height:30px; border:none; background:transparent; cursor:pointer;">
        </div>

        <button class="btn btn-main" style="margin-top: auto;" onclick="exportImage()">Export Result</button>
    </div>

    <div class="workspace">
        <div id="editor-container">
            <img id="base-image" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='390' height='500' viewBox='0 0 390 500'><rect width='100%' height='100%' fill='%23111214'/><text x='50%23' y='50%23' font-family='sans-serif' font-size='16' fill='%23949ba4' text-anchor='middle'>Upload a screenshot to begin</text></svg>">
        </div>
    </div>

    <script>
        const uploadImg = document.getElementById('upload-img');
        const baseImage = document.getElementById('base-image');
        const editorContainer = document.getElementById('editor-container');
        const patchColor = document.getElementById('patch-color');

        // Load the uploaded screenshot into the canvas frame
        uploadImg.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                baseImage.src = URL.createObjectURL(file);
                // Clear any leftover patches from previous edits
                document.querySelectorAll('.text-patch').forEach(el => el.remove());
            }
        });

        // Spawn an editable box over the image
        function addTextBlock() {
            const patch = document.createElement('div');
            patch.className = 'text-patch';
            patch.contentEditable = true;
            patch.innerText = 'New text...';
            patch.style.backgroundColor = patchColor.value;
            patch.style.left = '50px';
            patch.style.top = '100px';

            // Dragging Logic
            let isDragging = false;
            let startX, startY;

            patch.addEventListener('mousedown', (e) => {
                // Only drag if clicking near borders, allowing normal text insertion inside
                if (e.target === patch && document.activeElement !== patch) {
                    isDragging = true;
                    startX = e.clientX - patch.offsetLeft;
                    startY = e.clientY - patch.offsetTop;
                    e.preventDefault();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    let x = e.clientX - startX;
                    let y = e.clientY - startY;
                    
                    // Constrain within the canvas container boundaries
                    x = Math.max(0, Math.min(x, editorContainer.clientWidth - patch.clientWidth));
                    y = Math.max(0, Math.min(y, editorContainer.clientHeight - patch.clientHeight));
                    
                    patch.style.left = x + 'px';
                    patch.style.top = y + 'px';
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // Double click removes the block
            patch.addEventListener('dblclick', () => {
                patch.remove();
            });

            editorContainer.appendChild(patch);
        }

        // Live color updater for the active edits
        patchColor.addEventListener('input', () => {
            document.querySelectorAll('.text-patch').forEach(patch => {
                patch.style.backgroundColor = patchColor.value;
            });
        });

        // Render compilation engine
        function exportImage() {
            const patches = document.querySelectorAll('.text-patch');
            
            // Hide the edit boxes outline borders temporarily
            patches.forEach(p => p.classList.add('exporting'));

            html2canvas(editorContainer, {
                scale: 3, // Maintains high native fidelity zoom metrics
                logging: false,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Photoshopped_Chat_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                // Restore editing lines
                patches.forEach(p => p.classList.remove('exporting'));
            });
        }
    </script>
</body>
</html>
