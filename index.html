<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Screenshot Live Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-midnight: #000000;
            --text-color: #f2f3f5;
        }

        body {
            margin: 0;
            background: #111214;
            color: white;
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* --- TOP TOOLBAR --- */
        .toolbar {
            width: 100%;
            background: #1e1f22;
            padding: 15px;
            display: flex;
            gap: 20px;
            justify-content: center;
            border-bottom: 1px solid #000;
            z-index: 100;
        }

        .btn {
            background: #5865f2;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- THE EDITOR AREA --- */
        .canvas-container {
            position: relative;
            margin-top: 20px;
            background: var(--bg-midnight);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            display: none; /* Shown after upload */
        }

        #bg-image {
            display: block;
            max-width: 400px; /* Scaled for mobile screenshots */
            height: auto;
        }

        /* This layer sits on top of your photo */
        .interaction-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Editable text boxes that you position over the chat bubbles */
        .editable-text {
            position: absolute;
            color: var(--text-color);
            background: var(--bg-midnight); /* Blends into the black background */
            font-size: 15px;
            line-height: 1.3;
            outline: none;
            min-width: 40px;
            padding: 2px;
            cursor: text;
            white-space: pre-wrap;
        }

        .editable-text:hover {
            box-shadow: 0 0 0 1px #5865f2;
        }

        /* Hide the blue outlines when saving the photo */
        .exporting .editable-text {
            box-shadow: none !important;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="image-upload" accept="image/*" style="display:none">
        <button class="btn" onclick="document.getElementById('image-upload').click()">1. Upload Screenshot</button>
        <button class="btn" style="background:#248046" onclick="createNewText()">2. Add Editable Field</button>
        <button class="btn" style="background:#eb459e" onclick="saveImage()">3. Save Finished Image</button>
    </div>

    <div id="capture-area" class="canvas-container">
        <img id="bg-image" src="">
        <div id="interaction-layer" class="interaction-layer"></div>
    </div>

    <script>
        const upload = document.getElementById('image-upload');
        const bgImage = document.getElementById('bg-image');
        const container = document.getElementById('capture-area');
        const layer = document.getElementById('interaction-layer');

        // Step 1: Load your image.png
        upload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                bgImage.src = URL.createObjectURL(file);
                container.style.display = 'block';
            }
        });

        // Step 2: Create a text box you can move and type in
        function createNewText() {
            const div = document.createElement('div');
            div.className = 'editable-text';
            div.contentEditable = true;
            div.innerText = "Click to type...";
            div.style.left = "80px"; // Default position near avatar
            div.style.top = "100px";

            // Make it draggable so you can align it perfectly over the old text
            let isDragging = false;
            div.addEventListener('mousedown', (e) => {
                if (e.altKey) { // Hold ALT to drag
                    isDragging = true;
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const rect = container.getBoundingClientRect();
                    div.style.left = (e.clientX - rect.left - 20) + 'px';
                    div.style.top = (e.clientY - rect.top - 10) + 'px';
                }
            });

            document.addEventListener('mouseup', () => isDragging = false);

            layer.appendChild(div);
        }

        // Step 3: Screenshot the whole thing together
        function saveImage() {
            container.classList.add('exporting');
            
            html2canvas(container, {
                backgroundColor: '#000000',
                scale: 3,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'edited_conversation.png';
                link.href = canvas.toDataURL();
                link.click();
                container.classList.remove('exporting');
            });
        }
    </script>

    <div style="margin-top: 20px; color: #949ba4; font-size: 0.8rem;">
        Tip: <b>Hold ALT and Drag</b> to move text boxes | Double-click text to edit.
    </div>

</body>
</html>
