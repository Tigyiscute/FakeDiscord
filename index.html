<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Mobile DM Renderer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            /* Discord Mobile Midnight Theme Colors */
            --bg-midnight: #000000;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --date-line: #1e1f22;
            
            /* Sidebar Panel Styling */
            --panel-bg: #111214;
            --accent-blue: #5865f2;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #111214;
            color: #fff;
            display: flex;
            height: 100vh;
        }

        /* --- SIDEBAR CONTROLS --- */
        .sidebar {
            width: 360px;
            background: var(--panel-bg);
            border-right: 1px solid #1e1f22;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: var(--accent-blue);
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field label {
            font-size: 0.75rem;
            color: #b5bac1;
            font-weight: 700;
            text-transform: uppercase;
        }

        input[type="text"], textarea {
            background: #1e1f22;
            border: 1px solid #2b2d31;
            padding: 10px;
            border-radius: 4px;
            color: #dbdee1;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="file"] {
            color: #949ba4;
            font-size: 0.8rem;
        }

        .btn-export {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* --- MOBILE VIEWPORT STAGE --- */
        .stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1f22;
            padding: 20px;
            overflow-y: auto;
        }

        /* Matches the tight width constraints of a phone screen */
        #mobile-capture {
            background: var(--bg-midnight);
            width: 390px; /* Standard iPhone/Android viewport width width */
            padding: 16px 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* Date Separator Line */
        .date-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 16px 0;
            padding: 0 16px;
        }

        .date-divider::before, .date-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--date-line);
        }

        .date-text {
            padding: 0 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Mobile Message Item */
        .msg-item {
            display: flex;
            padding: 8px 16px;
            background: transparent;
        }

        .avatar-box {
            margin-right: 12px;
            flex-shrink: 0;
            position: relative;
            width: 40px;
            height: 40px;
        }

        .avatar-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Replicating the glowing Nitro decoration ring seen in your screenshot */
        .nitro-ring {
            position: absolute;
            top: -2px;
            left: -2px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1.5px solid #ff45a4;
            box-shadow: 0 0 8px #ff45a4;
            box-sizing: border-box;
            pointer-events: none;
            display: none; /* Controlled via toggle */
        }

        .msg-body-wrapper {
            display: flex;
            flex-direction: column;
        }

        .msg-meta {
            display: flex;
            align-items: center;
            margin-bottom: 2px;
        }

        .user-title {
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            margin-right: 8px;
        }

        .time-stamp {
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 500;
        }

        .text-content {
            color: #e0e1e5;
            font-size: 0.95rem;
            line-height: 1.3;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>Mobile DM Editor</h3>
        
        <div class="field">
            <label>Date Divider</label>
            <input type="text" id="in-divider" value="April 25, 2026">
        </div>

        <hr style="border-color: #2b2d31; width: 100%; margin: 5px 0;">

        <div class="field">
            <label>User Avatar (.png/.jpg)</label>
            <input type="file" id="up-avatar" accept="image/*">
        </div>

        <div class="field">
            <div style="display:flex; gap:8px; align-items:center;">
                <input type="checkbox" id="toggle-ring">
                <label for="toggle-ring" style="cursor:pointer; margin:0;">Glow Avatar Ring</label>
            </div>
        </div>

        <div class="field">
            <label>User Display Name</label>
            <input type="text" id="in-name" value="Arthur Morgan">
        </div>

        <div class="field">
            <label>Message Timestamp</label>
            <input type="text" id="in-time" value="4/25/26, 11:30 AM">
        </div>

        <div class="field">
            <label>Message Text</label>
            <textarea id="in-body" rows="4">im doing good too&#10;&#10;um when im going to get the ownership for my server?&#10;?</textarea>
        </div>

        <button class="btn-export" onclick="exportMobileCapture()">Download Mobile Screenshot</button>
    </div>

    <div class="stage">
        <div id="mobile-capture">
            
            <div class="date-divider">
                <span id="view-divider" class="date-text">April 25, 2026</span>
            </div>

            <div class="msg-item">
                <div class="avatar-box">
                    <div id="view-ring" class="nitro-ring"></div>
                    <img id="view-avatar" class="avatar-img" src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png">
                </div>
                <div class="msg-body-wrapper">
                    <div class="msg-meta">
                        <span id="view-name" class="user-title">Arthur Morgan</span>
                        <span id="view-time" class="time-stamp">4/25/26, 11:30 AM</span>
                    </div>
                    <div id="view-body" class="text-content">im doing good too

um when im going to get the ownership for my server?
?</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // DOM bindings
        const inDivider = document.getElementById('in-divider');
        const upAvatar = document.getElementById('up-avatar');
        const toggleRing = document.getElementById('toggle-ring');
        const inName = document.getElementById('in-name');
        const inTime = document.getElementById('in-time');
        const inBody = document.getElementById('in-body');

        const viewDivider = document.getElementById('view-divider');
        const viewAvatar = document.getElementById('view-avatar');
        const viewRing = document.getElementById('view-ring');
        const viewName = document.getElementById('view-name');
        const viewTime = document.getElementById('view-time');
        const viewBody = document.getElementById('view-body');

        // Dynamic binding loops
        inDivider.addEventListener('input', () => viewDivider.innerText = inDivider.value);
        inName.addEventListener('input', () => viewName.innerText = inName.value);
        inTime.addEventListener('input', () => viewTime.innerText = inTime.value);
        inBody.addEventListener('input', () => viewBody.innerText = inBody.value);

        toggleRing.addEventListener('change', () => {
            viewRing.style.display = toggleRing.checked ? 'block' : 'none';
        });

        upAvatar.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                viewAvatar.src = URL.createObjectURL(file);
            }
        });

        // Pixel-Perfect Exporter
        function exportMobileCapture() {
            const node = document.getElementById('mobile-capture');
            html2canvas(node, {
                backgroundColor: '#000000',
                scale: 3, // Super high resolution rendering to bypass text blur
                logging: false
            }).then(canvas => {
                const targetUri = canvas.toDataURL('image/png');
                const triggerLink = document.createElement('a');
                triggerLink.download = `Discord_Mobile_${Date.now()}.png`;
                triggerLink.href = targetUri;
                triggerLink.click();
            });
        }
    </script>
</body>
</html>
